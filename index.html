<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsTeledeutsch</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-whatsapp: #22c55e;
            --accent-telegram: #0ea5e9;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e293b, var(--bg-color));
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, var(--accent-whatsapp), var(--accent-telegram));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-secondary);
        }

        /* Glassmorphism Form */
        .form-section {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 60px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .form-section h2 {
            margin-bottom: 20px;
            font-weight: 500;
            text-align: center;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        input, select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            padding: 12px 15px;
            border-radius: 10px;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--accent-telegram);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #22c55e, #10b981);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.4);
        }

        /* Grid de Grupos */
        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .group-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .group-card:hover {
            transform: scale(1.03);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .group-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .group-card.WhatsApp::before { background: var(--accent-whatsapp); }
        .group-card.Telegram::before { background: var(--accent-telegram); }

        .badge {
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 10px;
            display: inline-block;
        }

        .WhatsApp .badge { background: rgba(34, 197, 94, 0.2); color: var(--accent-whatsapp); }
        .Telegram .badge { background: rgba(14, 165, 233, 0.2); color: var(--accent-telegram); }

        .group-card h3 {
            margin-bottom: 10px;
            font-size: 1.25rem;
        }

        .btn-join {
            display: block;
            text-align: center;
            text-decoration: none;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .btn-join:hover {
            background: rgba(255,255,255,0.15);
        }

        @media (max-width: 600px) {
            .input-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>WhatsTeledeutsch</h1>
            <p>Das größte Netzwerk zur Suche nach lebendigen Gemeinschaften</p>
        </header>

        <section class="form-section">
            <h2>🚀 Veröffentlichen Sie Ihre Community</h2>
            <form id="groupForm">
                <div class="input-group">
                    <input type="text" id="name" placeholder="Gruppenname" required>
                    <select id="type">
                        <option value="WhatsApp">WhatsApp</option>
                        <option value="Telegram">Telegram</option>
                    </select>
                </div>
                <input type="url" id="link" placeholder="Einladungslink (https://...)" required style="width: 100%; margin-bottom: 15px;">
                <button type="submit">Gruppe hinzufügen</button>
            </form>
        </section>

        <div class="groups-grid" id="grid">
            <!-- Ejemplo de como se ven las cards -->
            <div class="group-card WhatsApp">
                <span class="badge">WhatsApp</span>
                <h3>Adictos a la IA</h3>
                <p style="color: var(--text-secondary); font-size: 0.85rem;">Conversación sobre GPT, Gemini y más.</p>
                <a href="#" class="btn-join">Jetzt beitreten</a>
            </div>
            <div class="group-card Telegram">
                <span class="badge">Telegram</span>
                <h3>Cripto Señales</h3>
                <p style="color: var(--text-secondary); font-size: 0.85rem;">Análisis técnico y noticias diarias.</p>
                <a href="#" class="btn-join">Explorar canal</a>
            </div>
        </div>
    </div>

    <script>
        // Lógica de interacción y base de datos local
        const form = document.getElementById('groupForm');
        const grid = document.getElementById('grid');

        // Cargar datos
        let groups = JSON.parse(localStorage.getItem('social_groups')) || [];

        function render() {
            // Limpiamos pero dejamos los ejemplos estáticos si no hay nada
            if(groups.length > 0) {
                grid.innerHTML = '';
                groups.forEach(g => {
                    const div = document.createElement('div');
                    div.className = `group-card ${g.type}`;
                    div.innerHTML = `
                        <span class="badge">${g.type}</span>
                        <h3>${g.name}</h3>
                        <p style="color: #94a3b8; font-size: 0.85rem;">Neue Community kürzlich hinzugefügt.</p>
                        <a href="${g.link}" target="_blank" class="btn-join">Tritt der Gruppe bei</a>
                    `;
                    grid.prepend(div);
                });
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const newGroup = {
                name: document.getElementById('name').value,
                type: document.getElementById('type').value,
                link: document.getElementById('link').value
            };

            groups.push(newGroup);
            localStorage.setItem('social_groups', JSON.stringify(groups));

            // Animación visual simple al agregar
            render();
            form.reset();
        });

        render();
    </script>
</body>
</html>
